# LogSentinel testbed. RAM-first: every container has a memory cap; the total limit is about 1.1 GB.
# Swap is disabled per container (pilot 2: on CI runners with swap, the S6 leak swapped for 15+ min
# past its limit before the OOM kill, adding latency noise unrelated to the scenario).
#   docker compose -f testbed/docker-compose.yml up -d --build
#   docker compose -f testbed/docker-compose.yml --profile grafana up -d   (optional UI, +128 MB)
# Ports and the live-log directory are parameterised (LS_PORT_*, LS_LIVE_LOGS) so several stacks can
# run side by side; orchestrator/testbed.py sets them from LS_STACK.
name: logsentinel

x-app: &app
  build: ./services
  image: logsentinel-svc:0.1
  restart: unless-stopped
  volumes:
    - ${LS_LIVE_LOGS:-../data/raw/_live_logs}:/logs
    - app-state:/state
  environment: &app-env
    DATABASE_URL: postgresql://app:app@toxiproxy:5433/app
    ACCESS_LOG_SAMPLE: "0.05"
    APP_STARTUP_DELAY_S: "15"  # realistic warm-up after a (crash) restart; see common.py
  depends_on: [toxiproxy]
  cpus: 1.0

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    # Durability is off on purpose: the DB is disposable, and on the laptop, disk flushes during
    # the 5-min checkpoints stalled queries for >1 s (smoke run 2026-10-12). That is periodic noise
    # unrelated to any scenario. See docs/scenarios/sheets.md, "Testbed design decisions".
    command: >
      postgres -c shared_buffers=32MB -c max_connections=40 -c work_mem=2MB
               -c effective_cache_size=96MB -c max_parallel_workers_per_gather=0
               -c fsync=off -c synchronous_commit=off -c full_page_writes=off
               -c checkpoint_timeout=30min
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    mem_limit: 192m
    memswap_limit: 192m  # no swap: at the limit the kernel OOM-kills instead of swapping
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      retries: 20

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    restart: unless-stopped
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./observability/toxiproxy.json:/config/toxiproxy.json:ro
    ports: ["127.0.0.1:${LS_PORT_TOXIPROXY:-8474}:8474"]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 32m
    memswap_limit: 32m  # no swap: at the limit the kernel OOM-kills instead of swapping

  gateway:
    <<: *app
    environment: { <<: *app-env, SERVICE: gateway }
    ports: ["127.0.0.1:${LS_PORT_GATEWAY:-8080}:8000"]
    depends_on: [orders, inventory]
    mem_limit: 128m
    memswap_limit: 128m  # no swap: at the limit the kernel OOM-kills instead of swapping

  orders:
    <<: *app
    environment: { <<: *app-env, SERVICE: orders }
    ports: ["127.0.0.1:${LS_PORT_ORDERS:-8081}:8000"]
    mem_limit: 128m
    memswap_limit: 128m  # no swap: at the limit the kernel OOM-kills instead of swapping

  inventory:
    <<: *app
    environment: { <<: *app-env, SERVICE: inventory }
    ports: ["127.0.0.1:${LS_PORT_INVENTORY:-8082}:8000"]
    mem_limit: 192m  # the leak scenario (S6) runs into this limit -> OOM kill -> restart
    memswap_limit: 192m  # no swap: at the limit the kernel OOM-kills instead of swapping

  loadgen:
    <<: *app
    environment: { <<: *app-env, SERVICE: loadgen, APP_STARTUP_DELAY_S: "0", LOAD_RPS: "20", LATENCY_SLO_MS: "${LS_LATENCY_SLO_MS:-50}" }
    ports: ["127.0.0.1:${LS_PORT_LOADGEN:-8089}:8000"]
    depends_on: [gateway]
    mem_limit: 128m
    memswap_limit: 128m  # no swap: at the limit the kernel OOM-kills instead of swapping

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=10d
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:${LS_PORT_PROMETHEUS:-9090}:9090"]
    mem_limit: 256m
    memswap_limit: 256m  # no swap: at the limit the kernel OOM-kills instead of swapping

  grafana:
    image: grafana/grafana-oss:11.2.0
    profiles: [grafana]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/datasource.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
    ports: ["127.0.0.1:${LS_PORT_GRAFANA:-3000}:3000"]
    mem_limit: 128m
    memswap_limit: 128m  # no swap: at the limit the kernel OOM-kills instead of swapping

volumes:
  pgdata:
  promdata:
  app-state:
