# LogSentinel decision-time configuration: expected model, features, rule-based qualifier, actions.
# STATUS: DRAFT (v0). Rule thresholds are tuned on the validation split only (M6), then frozen.
version: v0-draft

decision_times_min: [2, 5, 10, 15, 20, 30]

expected:
  alpha: 0.1          # nominal 90% intervals (coverage is measured, not assumed)
  ridge: 0.01
  calib_frac: 0.4
  floor: 0.03

features:
  key_metrics: [gw_latency_p95_ms, gw_error_rate, svc_cpu, svc_rss_mb, db_latency_p95_ms, retries, timeouts]
  changed_service_metrics: [svc_latency_p95_ms, svc_cpu, svc_rss_mb, db_latency_p95_ms]
  recent_min: 2       # "now" window for current-state features
  slope_min: 5        # window for trend (worsening) features
  min_out_min: 1      # a metric "deviates" if outside its interval for at least this long

rules:
  cr_severe_min: 2            # same severity definition as the SLO (operational knowledge, not oracle)
  ar_material_min: 3          # earlier than the label's P_mat: decisions are made before the horizon ends
  ar_recurrent_intervals: 2
  ar_trend_out_frac: 0.5      # deviation-trend path (e.g. leak before impact)
  ar_trend_slope: 0.25        # z-units per minute
  ar_trend_t: 3.0             # ... and statistically clear (slope t-statistic)
  ar_trend_longest_min: 3
  ta_recovery_min: 2
  ba_flat_slope: 0.1          # persistent, no impact, no clear upward trend -> BA
  ba_trend_t: 2.0

# Operator cost of action a given true class y (docs/spec/evaluation.md section 4).
actions: [N, O, I, E]
costs:
  BA: [0, 0.1, 1, 3]
  TA: [0.2, 0, 1, 3]
  AR: [10, 6, 0, 1.5]
  CR: [50, 40, 10, 0]
