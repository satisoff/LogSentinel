id: S6
name: delayed_memory_leak
purpose: Deploy leaks memory per request; GC pauses grow and the container is OOM-killed later. Delayed onset.
horizon_min: 45   # extended label horizon for delayed onset (labels.md section 1)
change:
  change_type: deploy
  service: inventory
  to_version: "1.3.0"
  profile: {leak_kb_per_req: 35}
change_variants:
  # pilot 1: 8 KB/req grew RSS 2.2 MB/min at 4.3 inventory req/s -> OOM only after ~62 min.
  # pilot 2: retention matched the configured KB/req; the limit (~216 MB RSS) was reached on time,
  # but swap delayed the OOM kill by 15+ min (fixed: memswap_limit). Without swap, at ~4.3 req/s
  # these reach the limit at roughly 25 / 17 / 12 min:
  - {to_version: "1.3.0", profile: {leak_kb_per_req: 25}}
  - {to_version: "1.3.1", profile: {leak_kb_per_req: 35}}
  - {to_version: "1.3.2", profile: {leak_kb_per_req: 50}}
workload_variants:
  profile: [steady, diurnal]
  rps: [15, 20, 25]
oracle:
  intended_effects: {}
  change_causal: true
