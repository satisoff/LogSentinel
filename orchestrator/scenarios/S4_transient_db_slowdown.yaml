id: S4
name: transient_db_slowdown
purpose: Harmless config change, then a short coincident DB slowdown. Unexpected but short-lived -> TA.
change:
  change_type: config
  service: orders
  to_version: "1.0.0+cfg1"
  profile: {}
change_variants:
  - {service: orders,    to_version: "1.0.0+cfg1"}
  - {service: orders,    to_version: "1.0.0+cfg2"}
  - {service: inventory, to_version: "1.0.0+cfg1"}
workload_variants:
  profile: [steady, diurnal, bursty]
  rps: [15, 20, 25]
faults:
  - type: db_latency
    # pilot 1: +120-400 ms for 1-3 min queued requests to p95 4.7 s (CR). Shorter and milder:
    at_min: {uniform: [3, 12]}
    duration_min: {uniform: [0.5, 1.25]}
    params: {latency_ms: {uniform: [40, 200]}, jitter_ms: 10}
oracle:
  intended_effects: {}
  change_causal: false
